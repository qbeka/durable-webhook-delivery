# Settings shared by the engine and receiver clusters.
# wal_sync_method is passed by scripts/pg.sh so a run can vary only that.

listen_addresses = '127.0.0.1'
max_connections = 400

shared_buffers = 1GB
wal_buffers = 64MB
max_wal_size = 8GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Never relaxed: an acknowledged commit must survive a crash.
fsync = on
synchronous_commit = on
full_page_writes = on

# deliveries is a queue table. Keep vacuum ahead of its dead rows.
autovacuum_naptime = 5s
autovacuum_vacuum_cost_limit = 2000

log_min_messages = warning
log_checkpoints = off
